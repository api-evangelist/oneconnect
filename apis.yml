name: OneConnect
description: 'OneConnect Financial Technology (NYSE: OCFT; HKEX: 6638) is a technology-as-a-service
  platform for financial institutions, incorporated in 2015 as an associate of China''s Ping An
  Group to externalize its banking and insurance technology. Its cloud-native, microservices platform
  spans digital banking, digital insurance, and the Gamma platform (AI voice, computer vision, blockchain
  and big-data analytics), serving hundreds of banks and insurers across China and Southeast Asia with
  ready-to-integrate financial technology components exposed through Open APIs. OneConnect raised a
  US$650M Series A in 2018 from investors including the SoftBank Vision Fund and SBI Group. Its APIs
  are delivered as enterprise B2B integrations rather than a public self-serve developer portal.'
